<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="440" height="80"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>

</defs>
<path d="M12 -40V68M428 -40V68M12 68H428" fill="none" stroke="#f05138" stroke-width="3" opacity=".5" filter="url(#glow)"/>
<rect x="12" y="0" width="416" height="68" fill="#1f1f24"/>
<rect x="12" y="0" width="416" height="68" fill="url(#grid)"/>
<text x="32" y="30" class="dim"><tspan class="gr">$</tspan> exit</text>
<text x="32" y="52" class="dim">Program ended with exit code: <tspan class="ac">0</tspan> <tspan fill="#454b53">// EOF</tspan></text>
<path d="M12 0V68M428 0V68M12 68H428" fill="none" stroke="#f05138" stroke-width="1.2"/>
