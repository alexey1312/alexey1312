<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" role="img" aria-labelledby="t d">
<title id="t">Projects</title>
<desc id="d">Projects</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#7f8c98}.ac{fill:#f05138}.fg{fill:#dfdfe0}.gr{fill:#67b7a4}.wh{fill:#ffffff}.pk{fill:#ff7ab2}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f05138" stroke-opacity=".07"/></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="440" height="120"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>

</defs>
<path d="M12 -40V160M428 -40V160" fill="none" stroke="#f05138" stroke-width="3" opacity=".5" filter="url(#glow)"/>
<rect x="12" y="0" width="416" height="120" fill="#1f1f24"/>
<rect x="12" y="0" width="416" height="120" fill="url(#grid)"/>
<text x="32" y="44" font-weight="700" fill="#f05138" filter="url(#g)" opacity=".8" style="font-size:20px">~/</text>
<text x="32" y="44" font-weight="700" style="font-size:20px"><tspan class="ac">~/</tspan><tspan class="wh">projects</tspan></text>
<text x="408" y="44" text-anchor="end" letter-spacing="2" fill="#5f6a75" style="font-size:12px">// 04</text>
<line x1="32" y1="58" x2="408" y2="58" stroke="#f05138" stroke-opacity=".4"/>
<line x1="32" y1="58" x2="152" y2="58" stroke="#f05138" stroke-width="2"/>
<line x1="32" y1="58" x2="152" y2="58" stroke="#f05138" stroke-width="3" filter="url(#g)"/>
<g class="ln" style="animation-delay:0.15s"><text x="32" y="96" class="dim"><tspan class="gr">$</tspan> ls -l ~/projects</text></g>
<path d="M12 0V120M428 0V120" fill="none" stroke="#f05138" stroke-width="1.2"/>
<g fill="none" stroke="#f05138" stroke-width="2"></g>
</svg>
