<desc id="d">SwiftIndex (cli): Semantic code search for Swift codebases, as a CLI and as an MCP server for AI assistants. Install: brew install alexey1312/swift-index/swiftindex. Built with Swift, CLI, MCP server. 5 stars.</desc>
