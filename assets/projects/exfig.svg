<title id="t">ExFig</title>
<desc id="d">ExFig (author): Design-to-code CLI for Figma and Penpot. It exports colors, icons, images and type for iOS, Android, Flutter and Web. Install: brew install designpipe/tap/exfig. Built with Swift, CLI, macOS, Linux, Windows. 10 stars.</desc>
