<title id="t">Foldy</title>
<desc id="d">Foldy (macos app): Your desktop bends as you close the lid: the iPhone Duo fold on the MacBook you already have. Get it: foldy.proteinunit.dev. Built with Swift, ScreenCaptureKit, Metal. 2 stars.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
